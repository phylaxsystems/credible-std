name: Policy catalog
on:
  pull_request:
    paths: ['policy-catalog/**', 'scripts/policy-catalog-artifacts.py', 'src/**', 'foundry.toml', '.github/workflows/policy-catalog.yml']
  push:
    branches: [master, codex/policy-library]
    paths: ['policy-catalog/**', 'scripts/policy-catalog-artifacts.py', 'src/**', 'foundry.toml', '.github/workflows/policy-catalog.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: FOUNDRY_PROFILE=policy-library forge test
      - run: python3 scripts/policy-catalog-artifacts.py --check
      - name: Verify per-policy flattened sources
        run: |
          for policy in policy-catalog/policies/*; do
            slug=$(basename "$policy")
            forge flatten "$policy/policy.sol" -o "/tmp/$slug.sol"
            cmp "policy-catalog/bundles/$slug.sol" "/tmp/$slug.sol"
          done
