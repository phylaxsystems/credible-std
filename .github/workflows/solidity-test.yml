name: Solidity Test CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and verify npm package
        run: |
          ./shell/create_artifacts.sh
          jq --exit-status 'type == "array" and length > 0' artifacts/PhEvm.json >/dev/null
          npm pack --dry-run --ignore-scripts

  solidity-base:
    uses: phylaxsystems/actions/.github/workflows/solidity-base.yaml@main
    with:
      gas-diff-tolerance: 25
      # Protection-suite tests exercise the Phorge-only `cl.assertion` cheatcode, so the whole
      # suite runs under `pcl test` in the protection-pcl job instead of base `forge test`.
      forge-test-args: "--no-match-path 'test/{backtesting,protection}/**'"
      disable-gas-snapshot: true

  protection-pcl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install PCL
        run: |
          curl -sSL https://github.com/phylaxsystems/pcl/releases/download/1.6.0/pcl-1.6.0-linux-x86_64.tar.gz | tar -xz
          sudo install pcl/pcl /usr/local/bin/pcl

      - name: Run protection PCL tests
        # pcl 1.5.1 runs suites on default-stack (2 MiB) worker threads and overflows once enough
        # suites land on one worker; the 4-core runner hits this with the full protection tree
        # (PR #90 runs 29845819338, both attempts). 16 MiB clears it, verified 5/5 in a 4-CPU
        # linux/amd64 container where the default crashed 3/5. Drop when phorge sizes its
        # test-runner thread stacks explicitly.
        run: RUST_MIN_STACK=16777216 FOUNDRY_PROFILE=ci pcl test --match-path 'test/protection/**'

  # Discover every top-level example directory so new examples cannot miss CI.
  examples-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: profiles
        run: echo "matrix=$(./scripts/check_examples.sh --matrix)" >> "$GITHUB_OUTPUT"

  examples-pcl:
    needs: examples-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.examples-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install PCL
        run: |
          curl -sSL https://github.com/phylaxsystems/pcl/releases/download/1.6.0/pcl-1.6.0-linux-x86_64.tar.gz | tar -xz
          sudo install pcl/pcl /usr/local/bin/pcl

      - name: Check ${{ matrix.profile }} examples
        env:
          PROFILE: ${{ matrix.profile }}
        run: ./scripts/check_examples.sh "$PROFILE"
